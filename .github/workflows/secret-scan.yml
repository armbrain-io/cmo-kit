name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    uses: armbrain-io/.github/.github/workflows/secret-scan.yml@main
    with:
      # Public repository: run on GitHub-hosted machines (free for public repos),
      # never on the org's self-hosted runners (Council 1217.1a).
      runs_on: '["ubuntu-latest"]'
